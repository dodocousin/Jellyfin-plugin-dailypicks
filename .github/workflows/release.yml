# Push a tag like v1.0.0 to build, test and publish a release, then add it to manifest.json
# so Jellyfin servers see the new version in Dashboard > Plugins.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test Jellyfin.Plugin.DailyPicks.Tests --configuration Release

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}.0"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          dotnet build Jellyfin.Plugin.DailyPicks --configuration Release \
            -p:Version="$VERSION" -p:AssemblyVersion="$VERSION" -p:FileVersion="$VERSION"

      - name: Package
        run: |
          ZIP="daily-picks_${VERSION}.zip"
          mkdir -p artifacts
          zip -j "artifacts/$ZIP" Jellyfin.Plugin.DailyPicks/bin/Release/net10.0/Jellyfin.Plugin.DailyPicks.dll
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "CHECKSUM=$(md5sum "artifacts/$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          echo "NOTES<<EOF" >> "$GITHUB_ENV"; echo "${NOTES:-Release $VERSION}" >> "$GITHUB_ENV"; echo "EOF" >> "$GITHUB_ENV"
          gh release create "$GITHUB_REF_NAME" "artifacts/$ZIP" --title "Daily Picks $VERSION" --notes "${NOTES:-Release $VERSION}"

      - name: Add release to manifest.json
        run: |
          git fetch origin main
          git checkout main
          python3 scripts/update_manifest.py --version "$VERSION" --checksum "$CHECKSUM" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP}" \
            --changelog "$NOTES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Add ${VERSION} to manifest.json"
          git push origin main
